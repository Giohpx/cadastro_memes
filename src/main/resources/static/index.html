<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo de Memes - Desenhos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Cadastrar Novo Meme</h1>
    <form id="memeForm">
        <label for="nome">Nome do Meme:</label>
        <input type="text" id="nome" required placeholder="Ex: Pernalonga Comunista">

        <label for="descricao">Descrição ou Origem:</label>
        <input type="text" id="descricao" required placeholder="Ex: Episódio de 1940">

        <label for="urlImagem">URL da Imagem:</label>
        <input type="url" id="urlImagem" required placeholder="https://link-da-imagem.com/meme.jpg">

        <button type="submit">Salvar Meme</button>
    </form>

    <h2>Galeria de Memes</h2>
    <div id="galeriaMemes" class="galeria"></div>
</div>

<script>
    document.getElementById('memeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nome = document.getElementById('nome').value;
        const descricao = document.getElementById('descricao').value;
        const urlImagem = document.getElementById('urlImagem').value;

        await fetch('/api/desenhos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome, descricao, urlImagem })
        });

        document.getElementById('memeForm').reset();
        carregarMemes();
    });

    async function carregarMemes() {
        const response = await fetch('/api/desenhos');
        const memes = await response.json();
        const galeria = document.getElementById('galeriaMemes');
        galeria.innerHTML = '';

        memes.forEach(meme => {
            const card = document.createElement('div');
            card.className = 'meme-card';
            card.innerHTML = `
                    <img src="${meme.urlImagem}" alt="${meme.nome}">
                    <h3>${meme.nome}</h3>
                    <p>${meme.descricao}</p>
                    <button onclick="deletarMeme(${meme.id})">Excluir</button>
                `;
            galeria.appendChild(card);
        });
    }

    async function deletarMeme(id) {
        await fetch(`/api/desenhos/${id}`, { method: 'DELETE' });
        carregarMemes();
    }

    carregarMemes();
</script>
</body>
</html>
